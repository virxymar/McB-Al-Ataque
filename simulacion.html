<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8C9A72"><title>McB · Simulación</title><style>:root{--s:#8C9A72;--p:#E9AAA8;--bg:#F7F4EE;--paper:#FFFDF9;--ink:#282824;--mut:#716F68;--line:#E7E1D7}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--ink)}main{max-width:520px;margin:auto;min-height:100vh;background:var(--paper);padding:18px}.brand{font:italic 700 28px Georgia;color:#5F7756}.muted{font-size:13px;color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.hero{background:linear-gradient(145deg,#fff,#fff7f6)}h1,h2,p{margin:0}h1{font-size:24px}h2{font-size:19px;margin-bottom:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{display:inline-block;background:#E5EBDD;color:#56704E;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.btn{border:0;border-radius:13px;padding:10px 12px;background:var(--s);color:#fff;font-weight:800}.btn.alt{background:#fff;color:#5F7756;border:1px solid #AEB9A1}.task{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #eee}.task input{width:20px;height:20px;accent-color:var(--s)}.done{text-decoration:line-through;color:#999}.progress{height:9px;background:#eee;border-radius:999px;overflow:hidden;margin:12px 0 5px}.progress span{display:block;height:100%;background:var(--s)}textarea,input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit}textarea{min-height:90px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.day{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;background:#fff;font-size:12px}.ok{background:#E5EBDD}.notice{background:#F5F1E7;border-radius:14px;padding:12px;font-size:13px}.time{font-weight:800}.warn{color:#9a5a32}.realgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare{margin-top:10px;padding:10px;border-radius:12px;background:#F7F4EE}</style></head><body><main><div class="brand">McB · Laboratorio 🧪</div><div class="muted">Auditoría independiente · Casa de León</div><div id="app"></div></main><script>
const days=['lun','mar','mie','jue','vie'],names={lun:'Lunes',mar:'Martes',mie:'Miércoles',jue:'Jueves',vie:'Viernes'};
const base={lun:{title:'Puesta a punto general',tasks:[['Ventilar',5],['Hacer camas',10],['Recoger',10],['Repaso cocina si hace falta',10],['Quitar polvo general',20],['Aspirar o barrer',20],['Fregar zonas necesarias',20],['Colada si hay carga',15]]},mar:{title:'Baños',tasks:[['Ventilar',5],['Hacer camas',10],['Recogida rápida',5],['WC',10],['Lavabo y grifería',10],['Ducha o bañera',10],['Mampara',10],['Espejo',5],['Muebles por fuera',5],['Suelo',10],['Toallas si corresponde',5]]},mie:{title:'Dormitorios',tasks:[['Ventilar',5],['Hacer camas',10],['Cambiar sábanas',15],['Mesillas, cabeceros y muebles',15],['Espejos si los hay',5],['Aspirar o barrer',15],['Fregar si corresponde',15],['Colada de ropa de cama',20]]},jue:{title:'Salón / comedor',tasks:[['Ventilar',5],['Hacer camas',10],['Polvo de muebles',15],['Mesa y sillas',10],['Mueble TV',5],['Pantalla con bayeta',5],['Sofá y cojines',10],['Entrada y pasillo',10],['Aspirar',15],['Fregar si corresponde',15]]},vie:{title:'Cocina + cierre',tasks:[['Encimera',10],['Fregadero y grifería',10],['Vitro',10],['Frontal/salpicadero',10],['Frentes y tiradores',10],['Exterior electrodomésticos',10],['Repaso baños',10],['Aspirar general',15],['Fregar suelos necesarios',10],['Vaciar basura',5],['Dejar cocina recogida',5]]}};
const rot={1:{lun:['Puerta de entrada: recovecos, marco, manilla e interruptores',15],mar:['Juntas, esquinas y puntos de cal',20],mie:['Puertas, marcos, manillas e interruptores',20],jue:['Sofá a fondo: huecos, estructura y patas',20],vie:['Microondas por dentro + pequeños electrodomésticos',20]},2:{lun:['Rodapiés entrada/pasillos',15],mar:['Interior mueble/cajones baño',15],mie:['Rodapiés + exterior canapés',20],jue:['Cristales salón/comedor + carriles',25],vie:['Horno si lo necesita',25]},3:{lun:['Techos, esquinas altas y radiador',20],mar:['Azulejos altos',20],mie:['Partes superiores armarios + lámparas',25],jue:['Lámparas + decoración',20],vie:['Frigorífico por zonas',25]},4:{lun:['Cristales de otra zona + carriles',25],mar:['Radiador + puerta baño',20],mie:['Interior mesilla/cajonera',15],jue:['Textiles sofá + entrada',20],vie:['Armarios/cajones + zócalos',25]}};
function load(){try{return JSON.parse(localStorage.getItem('mcb_audit20')||'null')}catch(e){return null}}function save(s){localStorage.setItem('mcb_audit20',JSON.stringify(s))}function state(){const s=load()||{i:0,checks:{},notes:{},audited:{}};s.real=s.real||{};return s}function key(s){return'w'+(Math.floor(s.i/5)+1)+'-'+days[s.i%5]}function fmt(m){m=Number(m)||0;return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function render(){const s=state(),w=Math.floor(s.i/5)+1,d=days[s.i%5],k=key(s),b=base[d],r=rot[w][d],tasks=[...b.tasks,[r[0],r[1]]],checks=s.checks[k]||{},total=tasks.reduce((a,x)=>a+x[1],0),pct=Math.round(Object.values(checks).filter(Boolean).length/tasks.length*100),real=s.real[k]||{},realMin=(Number(real.h)||0)*60+(Number(real.m)||0),count=Object.values(s.audited).filter(Boolean).length,diff=realMin?realMin-total:null;app.innerHTML=`<div class="card hero"><span class="pill">DÍA ${s.i+1} DE 20 · SEMANA ${w}</span><h1 style="margin-top:8px">${names[d]} · ${b.title}</h1><div class="progress"><span style="width:${pct}%"></span></div><div class="row muted"><span>${pct}% marcado</span><span class="time">Estimado provisional: ${fmt(total)}</span></div></div><div class="card row"><button class="btn alt" id="prev" ${s.i===0?'disabled':''}>← Anterior</button><button class="btn" id="next" ${s.i===19?'disabled':''}>Siguiente →</button></div><div class="card"><h2>Tareas propuestas</h2>${tasks.map((x,j)=>`<label class="task ${checks[j]?'done':''}"><input type="checkbox" data-c="${j}" ${checks[j]?'checked':''}><span style="flex:1">${x[0]}</span><span class="muted">${x[1]} min*</span></label>`).join('')}<div class="muted" style="margin-top:8px">* Los minutos son solo una estimación inicial. No intentes adaptarte a ellos.</div></div><div class="card"><h2>⏱️ Tiempo real empleado</h2><div class="muted" style="margin-bottom:8px">Haz la limpieza a tu ritmo normal y apunta aquí lo que hayas tardado de verdad.</div><div class="realgrid"><label><span class="muted">Horas</span><input id="realH" type="number" min="0" max="9" value="${real.h??''}" placeholder="0"></label><label><span class="muted">Minutos</span><input id="realM" type="number" min="0" max="59" value="${real.m??''}" placeholder="00"></label></div><button class="btn" id="saveReal" style="margin-top:9px">Guardar tiempo real</button>${realMin?`<div class="compare"><div class="row"><span>Estimado provisional</span><b>${fmt(total)}</b></div><div class="row"><span>Tiempo real</span><b>${fmt(realMin)}</b></div><div class="row" style="margin-top:5px"><span>Diferencia</span><b class="${diff>0?'warn':''}">${diff===0?'Exacto':(diff>0?'+':'')+diff+' min'}</b></div>${realMin>120?'<div class="warn" style="margin-top:7px"><b>⚠️ Se ha superado el límite de 2 horas.</b></div>':'<div style="margin-top:7px;color:#56704E"><b>✓ Dentro del límite de 2 horas.</b></div>'}</div>`:''}</div><div class="card"><h2>📝 Nota de auditoría</h2><textarea id="note" placeholder="Ej.: el sofá tardó más; hoy no había colada; esta tarea sobra...">${s.notes[k]||''}</textarea><button class="btn" id="saveNote" style="margin-top:8px">Guardar nota</button></div><div class="card"><button class="btn ${s.audited[k]?'alt':''}" id="audit">${s.audited[k]?'✓ Día auditado · Deshacer':'✓ Dar día por auditado'}</button></div><div class="notice">🧪 Laboratorio independiente. No modifica la app real. Para auditar bien el día, registra el tiempo real y cualquier incidencia.</div><div class="card"><h2>Progreso · ${count}/20</h2>${grid(s)}</div>`;document.querySelectorAll('[data-c]').forEach(x=>x.onchange=()=>{const z=state(),kk=key(z);z.checks[kk]=z.checks[kk]||{};z.checks[kk][x.dataset.c]=x.checked;save(z);render()});prev.onclick=()=>move(-1);next.onclick=()=>move(1);saveReal.onclick=()=>{const z=state(),kk=key(z),h=Math.max(0,Number(realH.value)||0),m=Math.max(0,Math.min(59,Number(realM.value)||0));z.real[kk]={h,m};save(z);render()};saveNote.onclick=()=>{const z=state();z.notes[key(z)]=note.value;save(z);render()};audit.onclick=()=>{const z=state(),kk=key(z);z.audited[kk]=!z.audited[kk];save(z);render()}}
function grid(s){let h='';for(let w=1;w<=4;w++){h+=`<div class="muted" style="margin:8px 0 4px"><b>Semana ${w}</b></div><div class="grid">`;days.forEach(d=>{const ok=s.audited['w'+w+'-'+d];h+=`<div class="day ${ok?'ok':''}">${names[d].slice(0,2)}<br>${ok?'✓':'○'}</div>`});h+='</div>'}return h}function move(n){const s=state();s.i=Math.max(0,Math.min(19,s.i+n));save(s);render();scrollTo(0,0)}render();
</script></body></html>
