<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8C9A72"><title>McB · Configurador de hogar</title><style>:root{--sage:#83936d;--cream:#f7f3ed;--ink:#2d2c29;--mut:#74716a;--line:#e7e0d6}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui;color:var(--ink)}main{max-width:540px;margin:auto;min-height:100vh;background:#fffdf9;padding:18px}.brand{font:italic 700 28px Georgia;color:#607653}.sub,.muted{font-size:13px;color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:13px 0}h1{font-size:25px;margin:6px 0}h2{font-size:19px;margin:0 0 12px}.step{display:inline-block;background:#e7eddf;color:#57704d;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:var(--sage)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cfc9bf;background:#fff;padding:9px 11px;border-radius:99px;font-weight:700}.chip.on{background:#e7eddf;border-color:#a9b79c;color:#536c49}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.btn{border:0;border-radius:13px;padding:11px 14px;background:var(--sage);color:#fff;font-weight:800}.btn.alt{background:#fff;color:#607653;border:1px solid #aebaa3}.btn:disabled{opacity:.35}.notice{background:#f5f0e8;border-radius:14px;padding:12px;font-size:13px}.room{padding:10px 0;border-bottom:1px dashed #eee}.task{font-size:14px;padding:5px 0}.good{color:#57704d}.petline{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:end;padding:8px 0;border-bottom:1px dashed #eee}</style></head><body><main><div class="brand">McB · Al Ataque 🏠</div><div class="sub">Laboratorio · Configurador universal de hogares</div><div id="app"></div></main><script>
const D=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];let S=JSON.parse(localStorage.getItem('mcb_config_lab')||'null')||{step:0,name:'',adults:2,children:0,pets:{Perro:0,Gato:0,Ave:0,Otra:0},floors:1,bedrooms:3,bathrooms:1,toilets:0,terrace:false,balcony:false,patio:false,garden:false,garage:false,storage:false,laundry:true,windows:6,days:['Lun','Mar','Mié','Jue','Vie'],minutes:120,ironing:false,ironingMinutes:30,laundryTypes:[]};if(Array.isArray(S.pets)){let p={Perro:0,Gato:0,Ave:0,Otra:0};S.pets.forEach(x=>p[x]=1);S.pets=p}S.ironing??=false;S.ironingMinutes??=30;S.laundryTypes??=[];function save(){localStorage.setItem('mcb_config_lab',JSON.stringify(S))}function n(id){return Math.max(0,Number(document.getElementById(id)?.value)||0)}function bool(id){return !!document.getElementById(id)?.checked}function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);save();render()}function nav(x){read();S.step=Math.max(0,Math.min(5,S.step+x));save();render();scrollTo(0,0)}function read(){if(S.step===0){S.name=namev.value.trim()||'Mi hogar';S.adults=n('adults');S.children=n('children')}if(S.step===1){S.floors=Math.max(1,n('floors'));S.bedrooms=n('bedrooms');S.bathrooms=n('bathrooms');S.toilets=n('toilets');S.windows=n('windows');['terrace','balcony','patio','garden','garage','storage','laundry'].forEach(x=>S[x]=bool(x))}if(S.step===2)['Perro','Gato','Ave','Otra'].forEach(x=>S.pets[x]=n('pet'+x));if(S.step===3){S.ironing=bool('ironing');S.ironingMinutes=n('ironingMinutes')||30}if(S.step===4)S.minutes=n('minutes')||60;save()}function head(title,txt){return `<div class="card"><span class="step">PASO ${S.step+1} DE 6</span><h1>${title}</h1><div class="muted">${txt}</div><div class="bar"><span style="width:${(S.step+1)*100/6}%"></span></div></div>`}function buttons(){return `<div class="card row"><button class="btn alt" onclick="nav(-1)" ${S.step===0?'disabled':''}>← Atrás</button>${S.step<5?'<button class="btn" onclick="nav(1)">Continuar →</button>':''}</div>`}function render(){if(S.step===0)app.innerHTML=head('Primero, ¿quién vive aquí?','Cada hogar tendrá su propio plan, historial y checklist.')+`<div class="card"><label>¿Cómo quieres llamar a este hogar?</label><input id="namev" value="${S.name}" placeholder="Ej.: Casa de León"><div class="twocol"><div><label>Adultos</label><input id="adults" type="number" min="0" value="${S.adults}"></div><div><label>Niños</label><input id="children" type="number" min="0" value="${S.children}"></div></div></div>`+buttons();else if(S.step===1)app.innerHTML=head('Cuéntame cómo es la casa','Solo preguntamos lo necesario para construir el mapa de limpieza.')+`<div class="card"><div class="twocol"><div><label>Plantas</label><input id="floors" type="number" min="1" value="${S.floors}"></div><div><label>Dormitorios</label><input id="bedrooms" type="number" min="0" value="${S.bedrooms}"></div><div><label>Baños completos</label><input id="bathrooms" type="number" min="0" value="${S.bathrooms}"></div><div><label>Aseos</label><input id="toilets" type="number" min="0" value="${S.toilets}"></div><div><label>Ventanas aprox.</label><input id="windows" type="number" min="0" value="${S.windows}"></div></div><h2 style="margin-top:18px">¿Qué más tiene?</h2>${checks()}</div>`+buttons();else if(S.step===2)app.innerHTML=head('Mascotas: tipo y cantidad','Aquí sí importa el número: 2 gatos + 1 perro grande no generan la misma limpieza que una sola mascota.')+`<div class="card">${['Perro','Gato','Ave','Otra'].map(x=>`<div class="petline"><div><b>${x==='Perro'?'🐶':x==='Gato'?'🐱':x==='Ave'?'🐦':'🐾'} ${x}</b><div class="muted">Número de mascotas</div></div><input id="pet${x}" type="number" min="0" value="${S.pets[x]||0}"></div>`).join('')}<div class="notice" style="margin-top:14px">Más mascotas = más frecuencia de aspirado/barrido y más atención a zonas de paso, comida, camas o areneros.</div></div>`+buttons();else if(S.step===3)app.innerHTML=head('Colada y planchado','La ropa también cambia mucho la carga real de una casa.')+`<div class="card"><label>¿Qué tipo de ropa suele haber?</label><div class="chips">${['Ropa de bebé','Uniformes / trabajo','Ropa delicada','Mucha ropa de cama','Manchas frecuentes'].map(x=>`<button class="chip ${S.laundryTypes.includes(x)?'on':''}" onclick="toggle(S.laundryTypes,'${x}')">${x}</button>`).join('')}</div><label style="font-weight:600"><input id="ironing" type="checkbox" ${S.ironing?'checked':''} style="width:auto;margin-right:7px">👕 Se plancha en esta casa</label><label>Tiempo orientativo de planchado</label><select id="ironingMinutes"><option value="15" ${S.ironingMinutes==15?'selected':''}>≈ 15 min</option><option value="30" ${S.ironingMinutes==30?'selected':''}>≈ 30 min</option><option value="45" ${S.ironingMinutes==45?'selected':''}>≈ 45 min</option><option value="60" ${S.ironingMinutes==60?'selected':''}>≈ 1 hora</option><option value="90" ${S.ironingMinutes==90?'selected':''}>≈ 1 h 30</option></select><div class="notice" style="margin-top:12px">El planchado se contabiliza aparte de la limpieza, para no comerse el tiempo destinado a baños, cocina, polvo o suelos.</div></div>`+buttons();else if(S.step===4)app.innerHTML=head('¿Cómo quieres organizarte?','La app reparte el trabajo en tus días disponibles. El tiempo es una guía, nunca una carrera.')+`<div class="card"><label>¿Qué días quieres dedicar a esta casa?</label><div class="chips">${D.map(x=>`<button class="chip ${S.days.includes(x)?'on':''}" onclick="toggle(S.days,'${x}')">${x}</button>`).join('')}</div><label>Tiempo orientativo máximo de limpieza por día</label><select id="minutes"><option value="30" ${S.minutes==30?'selected':''}>≈ 30 minutos</option><option value="60" ${S.minutes==60?'selected':''}>≈ 1 hora</option><option value="90" ${S.minutes==90?'selected':''}>≈ 1 h 30 min</option><option value="120" ${S.minutes==120?'selected':''}>≈ 2 horas</option><option value="180" ${S.minutes==180?'selected':''}>≈ 3 horas</option></select><div class="notice" style="margin-top:12px">⏱️ El tiempo orienta, no manda. Si un día no se llega, McB reorganizará lo pendiente.</div></div>`+buttons();else app.innerHTML=result()}function checks(){return ['terrace:🌤️ Terraza','balcony:🏙️ Balcón','patio:🌿 Patio','garden:🌳 Jardín','garage:🚗 Garaje','storage:📦 Trastero','laundry:🧺 Zona de lavado'].map(v=>{let[a,b]=v.split(':');return `<label style="font-weight:600"><input id="${a}" type="checkbox" ${S[a]?'checked':''} style="width:auto;margin-right:7px">${b}</label>`}).join('')}function petTotal(){return Object.values(S.pets).reduce((a,b)=>a+(Number(b)||0),0)}function plan(){let rooms=[['Cocina',['Encimera, fregadero y vitro','Frentes y tiradores','Electrodomésticos por fuera','Suelo']],['Salón / comedor',['Polvo y superficies','Mesa y sillas','Sofá y cojines','Aspirar/barrer y suelo']]];if(S.bedrooms)rooms.push([`Dormitorios × ${S.bedrooms}`,['Ventilar y camas','Polvo y muebles','Cambio de ropa de cama','Aspirar/barrer y suelo']]);if(S.bathrooms+S.toilets)rooms.push([`Baños/aseos × ${S.bathrooms+S.toilets}`,['WC y lavabo','Ducha/bañera y mampara si corresponde','Espejos y muebles','Suelo']]);if(S.windows)rooms.push([`Ventanas × ${S.windows}`,['Cristales por zonas','Marcos, carriles y persianas en rotación']]);if(S.laundry){let t=['Ropa según carga','Ropa de cama/toallas','Lavadora: goma, cajetín y filtro periódicamente'];if(S.laundryTypes.includes('Ropa de bebé'))t.unshift('Ropa de bebé: revisar y tratar manchas antes del lavado');if(S.laundryTypes.includes('Uniformes / trabajo'))t.unshift('Uniformes / ropa de trabajo: lavado y revisión de manchas');if(S.laundryTypes.includes('Manchas frecuentes'))t.unshift('Pretratar manchas antes de meter en lavadora');rooms.push(['Colada',t])}if(S.ironing)rooms.push(['Planchado',[`Bloque independiente ≈ ${S.ironingMinutes} min`,'Separar prendas que necesitan plancha','Guardar/colocar al terminar']]);if(S.floors>1)rooms.push(['Escaleras',['Barandilla','Peldaños y rincones']]);[['terrace','Terraza'],['balcony','Balcón'],['patio','Patio'],['garden','Jardín'],['garage','Garaje'],['storage','Trastero']].forEach(x=>S[x[0]]&&rooms.push([x[1],['Recogida y repaso','Suelo/superficies','Limpieza profunda en rotación']]));const pt=petTotal();if(pt){let t=['Zona de comida y agua','Limpieza de camas/accesorios periódica'];if(S.pets.Gato)t.unshift('Arenero + pelos de zonas habituales');if(S.pets.Perro)t.unshift('Pelos y zonas de paso/entrada');if(pt>=3)t.unshift('Aspirado/barrido frecuente: prioridad alta');rooms.push([`Mascotas × ${pt}`,t])}return rooms}function result(){read();const rooms=plan(),people=S.adults+S.children,pt=petTotal(),load=rooms.length+(people>=4?2:0)+(pt>=3?3:pt?1:0)+(S.laundryTypes.length>=2?1:0),days=S.days.length||1;const petTxt=pt?Object.entries(S.pets).filter(x=>x[1]>0).map(x=>`${x[1]} ${x[0].toLowerCase()}${x[1]>1?'s':''}`).join(' · '):'sin mascotas';return head('✨ Este sería el mapa inicial',`McB ha construido un primer plan para ${S.name||'tu hogar'}.`)+`<div class="card"><h2>🏠 ${S.name||'Mi hogar'}</h2><div class="muted">${S.adults} adulto(s) · ${S.children} niño(s) · ${S.floors} planta(s) · ${S.bedrooms} dormitorio(s) · ${S.bathrooms+S.toilets} baño(s)/aseo(s) · ${petTxt}</div><div class="notice" style="margin-top:12px"><b>${days} día(s) de limpieza:</b> ${S.days.join(', ')||'ninguno seleccionado'}<br><b>Limpieza:</b> hasta ≈ ${S.minutes} min/día.${S.ironing?`<br><b>Planchado:</b> ≈ ${S.ironingMinutes} min aparte.`:''}<br><span class="good">El motor repartiría tareas y profundas en rotación.</span></div></div><div class="card"><h2>🗺️ Mapeo generado</h2>${rooms.map(r=>`<div class="room"><b>${r[0]}</b>${r[1].map(t=>`<div class="task">□ ${t}</div>`).join('')}</div>`).join('')}</div><div class="card"><h2>🧠 Lectura del motor</h2><div class="muted">Carga relativa detectada: <b>${load<=8?'ligera':load<=13?'media':'alta'}</b>. ${pt>=3?'La cantidad de mascotas eleva la prioridad de aspirado/barrido. ':''}${S.laundryTypes.includes('Ropa de bebé')||S.laundryTypes.includes('Uniformes / trabajo')?'La ropa especial añade revisión y tratamiento de manchas. ':''}Esto sirve para repartir, no para exigir un ritmo.</div></div><div class="card row"><button class="btn alt" onclick="S.step=0;save();render();scrollTo(0,0)">← Revisar respuestas</button><button class="btn" onclick="alert('Prototipo: todavía no se envía nada a la app real.')">Guardar hogar</button></div><div class="notice">🧪 Este configurador es independiente. No toca la app estable ni sus datos.</div>`}render();</script></body></html>
