name: Restaurar app completa
on:
  push:
    paths:
      - '.github/workflows/restaurar-app-completa.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar index completo
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > index.html
      - name: Guardar versión completa
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restaurar app McB completa' || exit 0
          git push
